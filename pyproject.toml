[project]
name = 'catscan'
version = '1.0.0'
description = 'A tool to visualize streams of events within a terminal, written with micro-architectural simulators in mind'
readme = 'README.md'
license = {file = 'LICENSE.txt'}
authors = [
  {name = 'Aaron Lindsay', email = 'aaron@os.amperecomputing.com'},
  {name = 'Nick Kelly', email = 'kellynic@os.amperecomputing.com'},
]
requires-python = ">= 3.12"
dependencies = [
  'capstone>=5.0',
  'protobuf>=4.25.0',
  'urwid>=2.6.16',
  'perf_streams @ git+ssh://git@github.com/AmpereComputing/perf-streams.git'
]

[dependency-groups]
build = [
    "hatch"
]
test = [
    "coverage"
]
lint = [
    "ruff"
]
all = [
    {include-group = "build"},
    {include-group = "test"},
    {include-group = "lint"},
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
catscan = 'catscan:__main__.main'

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.envs.hatch-test.scripts]
# Override the default 'run' script to use 'unittest'
run = "python -m unittest discover {args}"

[tool.ruff]
# Configure similar to black (except for line-length)
line-length = 120
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = [
  "A",
  "ANN",
  "B",
  "C4",
  "D3",
  "D4",
  "E4",
  "E7",
  "E9",
  "ERA",
  "F",
  "FURB",
  "I",
  "INT",
  "N",
  "PGH004",
  "PIE",
  "PL",
  "PYI",
  "RET",
  "SIM",
  "T20",
  "TID252",
  "UP",
]
ignore = [
  "ANN401",
  "B905",
  "F401",
  "F403",
  "W191",
  "E111",
  "E114",
  "E117",
  "E402",
  "E402",
  "E722",
  "E741",
  "D206",
  "D300",
  "Q000",
  "Q001",
  "Q002",
  "Q003",
  "COM812",
  "COM819",
  "ISC001",
  "ISC002",
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0914",
  "PLR0915",
  "PLR0916",
  "PLR0917",
  "PLR1702",
  "PLR2004",
  "SIM115",
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = ["F401"]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "ANN",
    "B",
    "D",
    "F405",
    "E731",
    "PLR2004",
    "PLR0904"
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
suppress-none-returning = true
suppress-dummy-args = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pep8-naming]
extend-ignore-names = ["assert*"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
